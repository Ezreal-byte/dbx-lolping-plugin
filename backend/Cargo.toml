[package]
name = "lolping-backend"
version = "0.2.1"
edition = "2021"
license = "MIT"

[dependencies]
dbx-plugin-sdk = { path = "../vendor/dbx-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "=0.35.3"
tiny-skia = "=0.12.0"
ttf-parser = "=0.25.1"
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
sha2 = "0.10"
base64 = "0.22"
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "gif", "jpeg"] }
opus = "=0.4.0"
ogg = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSApplication"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Explicitly keep raster/decode loops optimized when downstream profiles change.
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.image-webp]
opt-level = 3
