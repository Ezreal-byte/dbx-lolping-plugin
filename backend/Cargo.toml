[package]
name = "lolping-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
dbx-plugin-sdk = { path = "../vendor/dbx-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "=0.35.3"
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
sha2 = "0.10"
base64 = "0.22"
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "gif", "jpeg"] }
opus = "=0.4.0"
ogg = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSApplication"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
